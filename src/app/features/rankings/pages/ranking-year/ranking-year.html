<div class="usenet-dex-de_title m-prevnext">
  <div class="usenet-dex-de_prevnext m-white m-left">
    @if (prev) {
      <span class="e_first"><a [routerLink]="['/ranking', first.year ]">
        <i class="fa fa-chevron-double-left"></i>
      </a></span>

      <span class="e_prev"><a [routerLink]="['/ranking', prev ]">
        <i class="fa fa-chevron-left"></i>
        {{ prev }}
      </a></span>
    }
  </div>

  <h1>Ranking {{ year }}</h1>

  <div class="usenet-dex-de_prevnext m-white m-right">
    @if (next) {
      <span class="e_next"><a [routerLink]="['/ranking', next ]">
        {{ next }}
        <i class="fa fa-chevron-right"></i>
      </a></span>

      <span class="e_last"><a [routerLink]="['/ranking', last.year ]">
        <i class="fa fa-chevron-double-right"></i>
      </a></span>
    }
  </div>
</div>


<div class="usenet-dex-de_section">
  <app-ranking-list [rankingList]="ranking"></app-ranking-list>
</div>
